# Nginx template for low-risk multi-instance SkyBridge signaling deployment.
#
# Goal:
# - Do NOT change signaling payload protocol.
# - Keep in-memory state (`connectionCodes`, `iceCandidates`, `rooms`) valid by routing one session/code to one instance.
# - Prepare for future Redis by keeping the same topology and only swapping the state backend later.
#
# Important:
# - In memory mode, `/api/register` cannot be random + later URI-hash unless the code itself
#   deterministically identifies the owning instance.
# - This template therefore assumes each instance is configured with non-overlapping
#   `INSTANCE_CODE_PREFIXES`, and Nginx routes by the first code/session character.
#
# Example 2-node split:
# - signaling-a -> INSTANCE_CODE_PREFIXES=ABCDEFGHJKLMNPQ
# - signaling-b -> INSTANCE_CODE_PREFIXES=RSTUVWXYZ23456789
#
# Current Apple clients already append `?shard=<sessionId>` for `/ws`, so WebSocket traffic
# can follow the same deterministic route without payload changes.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format skybridge_main '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_user_agent"';

limit_req_zone $binary_remote_addr zone=skybridge_http_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=skybridge_ws_upgrade_per_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=skybridge_conn_per_ip:10m;

# Extract the first connection-code/session character from HTTP paths.
map $uri $skybridge_http_code_prefix {
    default '';
    ~^/api/lookup/([A-Z0-9])      $1;
    ~^/api/webrtc/lookup/([A-Z0-9]) $1;
    ~^/api/answer/([A-Z0-9])      $1;
    ~^/api/ice/([A-Z0-9])         $1;
}

# Prefer explicit ws shard, then sticky cookie.
map $arg_shard $skybridge_ws_code_prefix_from_query {
    default '';
    ~^([A-Z0-9])                  $1;
}

map $cookie_skybridge_route $skybridge_ws_code_prefix_from_cookie {
    default '';
    ~^([A-Z0-9])                  $1;
}

map "$skybridge_ws_code_prefix_from_query:$skybridge_ws_code_prefix_from_cookie" $skybridge_ws_code_prefix {
    ~^([A-Z0-9]):.*$              $1;
    ~^:([A-Z0-9])$                $1;
    default                       '';
}

# Route prefixes to concrete backends.
# Keep these aligned with each instance's `INSTANCE_CODE_PREFIXES`.
map $skybridge_http_code_prefix $skybridge_http_backend {
    default                       http://skybridge_signaling_register;
    ~^[ABCDEFGHJKLMNPQ]$          http://10.0.0.11:8443;
    ~^[RSTUVWXYZ23456789]$        http://10.0.0.12:8443;
}

map $skybridge_ws_code_prefix $skybridge_ws_backend {
    default                       http://skybridge_signaling_register;
    ~^[ABCDEFGHJKLMNPQ]$          http://10.0.0.11:8443;
    ~^[RSTUVWXYZ23456789]$        http://10.0.0.12:8443;
}

# `/api/register`, `/health`, root, etc. can still round-robin.
upstream skybridge_signaling_register {
    server 10.0.0.11:8443 max_fails=3 fail_timeout=10s;
    server 10.0.0.12:8443 max_fails=3 fail_timeout=10s;
    keepalive 128;
}

server {
    listen 443 ssl http2;
    server_name api.nebula-technologies.net;

    ssl_certificate     /etc/letsencrypt/live/api.nebula-technologies.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nebula-technologies.net/privkey.pem;

    access_log /var/log/nginx/skybridge-signaling-access.log skybridge_main;

    client_max_body_size 32k;
    large_client_header_buffers 4 16k;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;

    location = /api/webrtc/admission/challenge {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://skybridge_signaling_register;
    }

    location = /api/webrtc/admission {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://skybridge_signaling_register;
    }

    location = /api/turn/credentials {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://skybridge_signaling_register;
    }

    location = /api/register {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://skybridge_signaling_register;
    }

    location = /api/webrtc/register-code {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://skybridge_signaling_register;
    }

    location = /api/webrtc/register-session {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://skybridge_signaling_register;
    }

    location ^~ /api/lookup/ {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        add_header X-SkyBridge-LB-Shard $skybridge_http_code_prefix always;
        proxy_http_version 1.1;
        proxy_pass $skybridge_http_backend$request_uri;
    }

    location ^~ /api/webrtc/lookup/ {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        add_header X-SkyBridge-LB-Shard $skybridge_http_code_prefix always;
        proxy_http_version 1.1;
        proxy_pass $skybridge_http_backend$request_uri;
    }

    location = /api/webrtc/redeem-session {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://skybridge_signaling_register;
    }

    location ^~ /api/answer/ {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        add_header X-SkyBridge-LB-Shard $skybridge_http_code_prefix always;
        proxy_http_version 1.1;
        proxy_pass $skybridge_http_backend$request_uri;
    }

    location ^~ /api/ice/ {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        add_header X-SkyBridge-LB-Shard $skybridge_http_code_prefix always;
        proxy_http_version 1.1;
        proxy_pass $skybridge_http_backend$request_uri;
    }

    location = /ws {
        limit_req zone=skybridge_ws_upgrade_per_ip burst=10 nodelay;
        limit_conn skybridge_conn_per_ip 20;
        add_header X-SkyBridge-LB-Shard $skybridge_ws_code_prefix always;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass $skybridge_ws_backend$request_uri;
    }

    location / {
        limit_req zone=skybridge_http_per_ip burst=20 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://skybridge_signaling_register;
    }
}

server {
    listen 80;
    server_name api.nebula-technologies.net;
    return 301 https://$host$request_uri;
}
