# Nginx template for SkyBridge signaling service.
#
# Typical path:
#   Cloudflare TLS edge -> Nginx -> Node (127.0.0.1:8443)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format skybridge_main '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=skybridge_http_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=skybridge_ws_upgrade_per_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=skybridge_conn_per_ip:10m;

upstream skybridge_signaling_backend {
    server 127.0.0.1:8443;
    keepalive 64;
}

server {
    listen 443 ssl http2;
    server_name api.nebula-technologies.net;

    # Managed by certbot or your certificate automation.
    ssl_certificate     /etc/letsencrypt/live/api.nebula-technologies.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nebula-technologies.net/privkey.pem;

    # Optional if running behind Cloudflare and real-ip module is configured.
    # set_real_ip_from 173.245.48.0/20;
    # real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/skybridge-signaling-access.log skybridge_main;

    client_max_body_size 32k;
    large_client_header_buffers 4 16k;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;

    location = /api/webrtc/admission/challenge {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://skybridge_signaling_backend;
    }

    location = /api/webrtc/admission {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://skybridge_signaling_backend;
    }

    location = /api/turn/credentials {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://skybridge_signaling_backend;
    }

    location = /api/webrtc/register-code {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://skybridge_signaling_backend;
    }

    location = /api/webrtc/register-session {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://skybridge_signaling_backend;
    }

    location ^~ /api/webrtc/lookup/ {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://skybridge_signaling_backend;
    }

    location = /api/webrtc/redeem-session {
        limit_req zone=skybridge_http_per_ip burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://skybridge_signaling_backend;
    }

    location /ws {
        limit_req zone=skybridge_ws_upgrade_per_ip burst=10 nodelay;
        limit_conn skybridge_conn_per_ip 20;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://skybridge_signaling_backend/ws;
    }

    location / {
        limit_req zone=skybridge_http_per_ip burst=20 nodelay;
        proxy_http_version 1.1;
        proxy_pass http://skybridge_signaling_backend;
    }
}

server {
    listen 80;
    server_name api.nebula-technologies.net;
    return 301 https://$host$request_uri;
}
