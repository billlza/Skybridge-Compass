[workspace]
members = [
    "crates/skybridge-core",
    "crates/skybridge-agent",
    "crates/skybridge-cli",
    "crates/skybridge-auth-mail",
    "crates/skybridge-crossnet-client",
    "crates/skybridge-ffi",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.1"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1.0.102"
aes-gcm = "0.10.3"
async-trait = "0.1.89"
axum = { version = "0.8.6", features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
bytes = "1.11.1"
clap = { version = "4.6.0", features = ["derive", "env"] }
directories = "6.0.0"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
futures-util = "0.3.32"
getrandom = "0.3.4"
hkdf = "0.12.4"
hmac = "0.12.1"
hostname = "0.4.2"
hpke = "0.13"
mdns-sd = "0.20.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
pqcrypto-mldsa = { version = "0.1.2", default-features = false, features = ["std"] }
pqcrypto-mlkem = { version = "0.1.1", default-features = false, features = ["std"] }
pqcrypto-traits = "0.3.5"
reqwest = { version = "0.12.24", default-features = false, features = ["charset", "http2", "json", "macos-system-configuration", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sha3 = "0.10.8"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }
tokio = { version = "1.50.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json", "time"] }
url = "2.5.8"
uuid = { version = "1.22.0", features = ["serde", "v4", "v7"] }
webbrowser = "1.2.0"
webrtc = "0.20.0-alpha.1"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "getrandom"] }
