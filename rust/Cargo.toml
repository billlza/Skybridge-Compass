[workspace]
members = [
    "crates/skybridge-core",
    "crates/skybridge-agent",
    "crates/skybridge-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "1.0.2"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1.0.100"
aes-gcm = "0.10.3"
base64 = "0.22.1"
bytes = "1.10.1"
clap = { version = "4.5.51", features = ["derive", "env"] }
directories = "6.0.0"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
futures-util = "0.3.32"
getrandom = "0.3.4"
hkdf = "0.12.4"
hmac = "0.12.1"
hostname = "0.4.1"
hpke = "=0.13.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
pqcrypto-mldsa = { version = "0.1.2", default-features = false, features = ["std"] }
pqcrypto-mlkem = { version = "0.1.1", default-features = false, features = ["std"] }
pqcrypto-traits = "0.3.5"
reqwest = { version = "0.12.24", default-features = false, features = ["charset", "http2", "json", "macos-system-configuration", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sha3 = "0.10.8"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json", "time"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4", "v7"] }
webbrowser = "1.0.6"
webrtc = "0.17.1"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "getrandom"] }
