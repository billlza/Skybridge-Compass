language = "C"
header = """
/*
 * skybridge_ffi.h — C ABI for the SkyBridge portable secure-transport core.
 *
 * GENERATED by cbindgen from crates/skybridge-ffi. Do not edit by hand.
 *
 * This is the language-agnostic surface that lets non-Rust clients
 * (Windows C#/.NET via P/Invoke, C/C++, Linux) drive the same SkyBridge
 * protocol/handshake/policy/discovery core the Apple apps use, instead of
 * each platform reimplementing the protocol.
 *
 * Memory & threading contract:
 *   - All handles are opaque; create with the matching *_new/_create call and
 *     release exactly once with the matching *_free call. Double-free is UB.
 *   - Functions returning `SkyBridgeBuffer` transfer ownership of the buffer to
 *     the caller; release it with `skybridge_buffer_free`.
 *   - Callbacks may be invoked from a background thread. They must be
 *     re-entrancy-safe and must not call back into the same client handle.
 *   - No Rust panic ever crosses the boundary; failures are reported via
 *     `SkyBridgeStatus` return codes.
 */
"""
include_guard = "SKYBRIDGE_FFI_H"
autogen_warning = "/* WARNING: generated file — edits will be overwritten by the build. */"
tab_width = 4
style = "type"
cpp_compat = true
documentation = true
documentation_style = "doxy"

# Type names already carry the `SkyBridge` prefix in Rust, so no extra export
# prefix is added (avoids a `SkyBridgeSkyBridge*` double prefix).

[enum]
# Qualified screaming-snake variants (enum name + variant) without an extra
# `prefix_with_name`, which would otherwise duplicate the enum name.
rename_variants = "QualifiedScreamingSnakeCase"

[parse]
parse_deps = false

[defines]
"feature = uniffi-scaffolding" = "SKYBRIDGE_FFI_UNIFFI"
