services:
  backend:
    build:
      context: ./backend
    environment:
      SKYBRIDGE_BIND_HOST: 0.0.0.0
      SKYBRIDGE_BIND_PORT: 8080
      # Allow the local frontend during dev/demo.
      SKYBRIDGE_WEB_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

