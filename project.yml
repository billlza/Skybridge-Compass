name: SkyBridgeWidgets
options:
  bundleIdPrefix: com.skybridge.compass
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.4"
  developmentLanguage: zh-Hans

settings:
  base:
    # Note: SWIFT_VERSION is the Swift language major (6.0). Minor (6.3+) is determined by the toolchain/Xcode.
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ONLY_ACTIVE_ARCH: YES
    ARCHS: arm64
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1.0.0"

packages:
  SkyBridgeCompassApp:
    path: .
  swift-collections:
    url: https://github.com/apple/swift-collections
    from: "1.4.1"

targets:
  SkyBridgeCompassMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/SkyBridgeCompassApp
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
          - "Resources/AppIcon.icon/**"
      - path: XcodeSupport/SkyBridgeCompassMac/BundleModule.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skybridge.compass.pro
        PRODUCT_NAME: SkyBridge Compass Pro
        EXECUTABLE_NAME: SkyBridgeCompassApp
        INFOPLIST_FILE: XcodeSupport/SkyBridgeCompassMac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: Sources/SkyBridgeCompassApp/SkyBridgeCompassApp.packaging.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPLE_SILICON_OPTIMIZED ARM64_NATIVE"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -I -Xcc $(PROJECT_DIR)/Sources/Vendor/WebRTCHeaders"
        OTHER_CFLAGS: "$(inherited)"
        OTHER_CPLUSPLUSFLAGS: "$(inherited)"
    dependencies:
      - package: SkyBridgeCompassApp
        product: SkyBridgeCore
      - package: SkyBridgeCompassApp
        product: SkyBridgeUI
      - package: SkyBridgeCompassApp
        product: SkyBridgeVisualParity
      - package: SkyBridgeCompassApp
        product: SkyBridgeProtocolCore
      - package: swift-collections
        product: OrderedCollections
      - target: SkyBridgeCompassWidgetsExtension
        embed: true
      - framework: AppIntents.framework
        embed: false
      - framework: WidgetKit.framework
        embed: false
      - framework: SwiftUI.framework
        embed: false
      - framework: AuthenticationServices.framework
        embed: false
      - framework: WebKit.framework
        embed: false
      - framework: UserNotifications.framework
        embed: false

  SkyBridgeCompassWidgetsExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/SkyBridgeCompassWidgets
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skybridge.compass.pro.widgets
        INFOPLIST_FILE: Sources/SkyBridgeCompassWidgets/Info.plist
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
        PRODUCT_NAME: SkyBridgeCompassWidgetsExtension
    dependencies:
      - package: SkyBridgeCompassApp
        product: SkyBridgeWidgetShared
      - framework: WidgetKit.framework
        embed: false
      - framework: SwiftUI.framework
        embed: false
      - framework: AppIntents.framework
        embed: false

schemes:
  SkyBridgeCompassMac:
    build:
      targets:
        SkyBridgeCompassMac: all
    run:
      config: Release
    archive:
      config: Release

  SkyBridgeCompassWidgetsExtension:
    build:
      targets:
        SkyBridgeCompassWidgetsExtension: all
    run:
      config: Release
    archive:
      config: Release
