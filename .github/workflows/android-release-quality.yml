name: android-release-quality

on:
  pull_request:
    paths:
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/android-release-quality.yml"
      - "Package.swift"
      - "Package.resolved"
      - "platforms/android/**"
      - "SkyBridge Compass iOS/**"
      - "Sources/**"
      - "Tests/**"
  push:
    branches:
      - main
      - "release/android-*"
    paths:
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/android-release-quality.yml"
      - "Package.swift"
      - "Package.resolved"
      - "platforms/android/**"
      - "SkyBridge Compass iOS/**"
      - "Sources/**"
      - "Tests/**"

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: android-release-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install fixed Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager >/dev/null
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          (( license_status == 0 ))
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;30.0.14904198" \
            "cmake;3.22.1"
          java -version
          sdkmanager --list_installed

      - name: Validate release gate contracts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes python3-pil ripgrep shellcheck
          python3 -W error -B scripts/tests/test_launcher_icon_generation_contract.py
          python3 -W error -B scripts/tests/test_android_quality_reports.py
          python3 -W error -B scripts/tests/test_android_pqc_native_runtime_evidence.py
          python3 -W error -B scripts/tests/test_android_pqc_native_runtime_gate_behavior.py
          python3 -W error -B scripts/tests/test_android_pqc_native_runtime_gate_contract.py
          python3 -W error -B scripts/tests/test_validate_android_ios_physical_evidence.py
          python3 -W error -B scripts/tests/test_android_ios_physical_runner_contract.py
          python3 -W error -B scripts/tests/test_validate_android_mac_webrtc_formal_evidence.py
          python3 -W error -B scripts/tests/test_android_mac_webrtc_formal_runner_contract.py
          python3 -W error -B scripts/tests/test_validate_ios_copy_absence.py
          python3 -W error -B scripts/tests/test_webrtc_smoke_process_ownership.py
          python3 -W error -B -m py_compile \
            scripts/lib/webrtc_smoke_process_ownership.py \
            scripts/validate_android_mac_webrtc_formal_evidence.py \
            scripts/validate_android_ios_physical_evidence.py \
            scripts/validate_ios_copy_absence.py
          bash -n \
            scripts/check_android_packaged_placeholders.sh \
            scripts/check_android_release_aab.sh \
            scripts/lib/strict_gradle_output.sh \
            scripts/run_android_pqc_native_runtime_gate.sh \
            scripts/run_android_mac_webrtc_formal_smoke.sh \
            scripts/run_android_ios_webrtc_offer_smoke.sh \
            scripts/lib/android_env.sh \
            scripts/lib/real_device_ios_process_ownership.sh \
            scripts/lib/repository_layout.sh \
            scripts/lib/source_provenance.sh \
            scripts/tests/test_android_release_aab_gate.sh \
            scripts/tests/test_android_env_device_helpers.sh \
            scripts/tests/test_release_artifact_preflight.sh \
            scripts/tests/test_tracked_liboqs_build_contract.sh \
            scripts/tests/test_viewer_only_packaging_gate.sh
          shellcheck -x -S warning \
            scripts/check_android_packaged_placeholders.sh \
            scripts/check_android_release_aab.sh \
            scripts/lib/android_packaging_policy.sh \
            scripts/lib/android_env.sh \
            scripts/lib/real_device_ios_process_ownership.sh \
            scripts/lib/repository_layout.sh \
            scripts/lib/source_provenance.sh \
            scripts/lib/strict_gradle_output.sh \
            scripts/run_android_mac_webrtc_formal_smoke.sh \
            scripts/run_android_ios_webrtc_offer_smoke.sh \
            scripts/run_android_pqc_native_runtime_gate.sh \
            scripts/tests/test_android_release_aab_gate.sh \
            scripts/tests/test_android_env_device_helpers.sh \
            scripts/tests/test_release_artifact_preflight.sh \
            scripts/tests/test_tracked_liboqs_build_contract.sh \
            scripts/tests/test_viewer_only_packaging_gate.sh
          bash scripts/tests/test_android_release_aab_gate.sh
          bash scripts/tests/test_android_env_device_helpers.sh
          bash scripts/tests/test_release_artifact_preflight.sh
          bash scripts/tests/test_tracked_liboqs_build_contract.sh
          bash scripts/tests/test_viewer_only_packaging_gate.sh

      - name: Run full zero-warning Android matrix
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lib/strict_gradle_output.sh
          gradle_log="$RUNNER_TEMP/android-gradle.log"
          ./gradlew \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            --rerun-tasks \
            --warning-mode all \
            :shared:testDebugUnitTest \
            :core:testDebugUnitTest \
            :device-discovery:testDebugUnitTest \
            :remote-control:testDebugUnitTest \
            :file-transfer:testDebugUnitTest \
            :app:testDebugUnitTest \
            :shared:lintDebug \
            :core:lintDebug \
            :device-discovery:lintDebug \
            :remote-control:lintDebug \
            :file-transfer:lintDebug \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :shared:assembleRelease \
            :app:compileReleaseKotlin \
            2>&1 | tee "$gradle_log"
          skybridge_require_zero_warning_tool_log "$gradle_log"
          python3 -W error -B scripts/check_android_quality_reports.py \
            --root . \
            shared \
            core \
            device-discovery \
            remote-control \
            file-transfer \
            app

      - name: Inspect the diagnostic viewer artifact
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$RUNNER_TEMP/android-packaging-audit"
          scripts/check_android_packaged_placeholders.sh \
            --mode diagnostic-debug \
            --run-dir "$audit_dir"
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" \
            -c -P 16 -v 4 \
            app/build/outputs/apk/debug/app-debug.apk
          git -C "$GITHUB_WORKSPACE" diff --check
          [[ -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=all)" ]]

  formal-mac-quality:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify fixed Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          [[ "$(sw_vers -productVersion)" == 26.* ]]
          xcodebuild -version | grep -Eq '^Xcode 26\.'
          swift --version | grep -Eq 'Swift version 6\.3([ .]|$)'

      - name: Build and test formal macOS interoperability
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch Package.resolved >/dev/null
          swift build \
            --disable-automatic-resolution \
            --product FormalMacWebRTCHost \
            -Xswiftc -warnings-as-errors
          swift test \
            --disable-automatic-resolution \
            -Xswiftc -warnings-as-errors \
            --filter FormalMacInteropTests
          swift test \
            --disable-automatic-resolution \
            -Xswiftc -warnings-as-errors
          git diff --exit-code -- Package.swift Package.resolved
          git diff --check
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

      - name: Compile the independent iOS application target
        shell: bash
        run: |
          set -euo pipefail
          ios_log="$RUNNER_TEMP/ios-build-for-testing.log"
          xcodebuild \
            -project "SkyBridge Compass iOS/SkyBridgeCompass-iOS.xcodeproj" \
            -scheme "SkyBridgeCompass-iOS" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-ios" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            build-for-testing 2>&1 | tee "$ios_log"
          if grep -Eiq '(^|[[:space:]])(warning|error):' "$ios_log"; then
            echo "iOS build emitted a warning or error diagnostic" >&2
            exit 1
          fi
          git diff --check
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
