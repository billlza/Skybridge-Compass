name: macos-release-readiness

on:
  pull_request:
    paths:
      - ".github/actionlint.yaml"
      - ".github/workflows/macos-release-readiness.yml"
      - ".github/workflows/real-device-release-gate.yml"
      - "Package.swift"
      - "Packages/**"
      - "SkyBridge Compass iOS/**"
      - "Sources/**"
      - "Tests/**"
      - "Scripts/**"
      - "fastlane/**"
      - "README.md"
      - "rust/**"
  push:
    paths:
      - ".github/actionlint.yaml"
      - ".github/workflows/macos-release-readiness.yml"
      - ".github/workflows/real-device-release-gate.yml"
      - "Package.swift"
      - "Packages/**"
      - "SkyBridge Compass iOS/**"
      - "Sources/**"
      - "Tests/**"
      - "Scripts/**"
      - "fastlane/**"
      - "README.md"
      - "rust/**"
  workflow_dispatch:
    inputs:
      release_artifact_run_id:
        description: "Workflow run id containing the real-device release-gate artifacts"
        required: true
        type: string
      release_artifact_run_attempt:
        description: "Workflow run attempt that produced the real-device release-gate artifacts"
        required: true
        type: string
      publish_update_release:
        description: "Publish a new immutable release after every source, device-evidence, signing, notarization, and asset gate passes"
        required: true
        default: false
        type: boolean
      publish_release_tag:
        description: "Exact pre-pushed tag to publish (macos-v<semver>-build-<build>); required when publishing"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-preflight:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SKYBRIDGE_REQUIRED_XCODE_VERSION: "26.6"
      SKYBRIDGE_REQUIRED_XCODE_BUILD: "17F113"
      SKYBRIDGE_REQUIRED_APPLE_SWIFT_VERSION: "6.3.3"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Select Xcode 26.6 / Swift 6.3.3 Toolchain
        run: |
          [[ -d "$DEVELOPER_DIR" ]] || { echo "::error::Required Xcode 26.6 is missing at $DEVELOPER_DIR"; exit 1; }
          sudo xcode-select -s "$DEVELOPER_DIR"
          bash Scripts/verify_xcode_toolchain.sh

      - name: Self-Test iOS XCTest Guardrail
        run: bash Scripts/test_check_ios_test_configuration.sh

      - name: Self-Test Swift Filter Guardrail
        run: bash Scripts/test_run_swift_test_filter.sh

      - name: Self-Test Apple P2P No-Trap Guardrail
        run: python3 Scripts/test_check_p2p_no_traps.py

      - name: Enforce Apple P2P No-Trap Guardrail
        run: python3 Scripts/check_p2p_no_traps.py

      - name: Self-Test Real-Device Release Acceptance Artifacts
        run: python3 Scripts/test_validate_real_device_release_acceptance_artifact.py

      - name: Self-Test Release Acceptance Manifest Finalization
        run: python3 Scripts/test_finalize_release_acceptance_manifests.py

      - name: Self-Test iOS Distribution Product Boundary
        run: python3 Scripts/test_verify_ios_distribution_product.py

      - name: Self-Test Real-Device Evidence Workflow Contract
        run: python3 Scripts/test_real_device_release_workflow_contract.py

      - name: Self-Test Real-Device Evidence File-Set Contract
        run: python3 Scripts/test_stage_real_device_release_evidence.py

      - name: Self-Test macOS Release Handoff Boundary
        run: python3 Scripts/test_extract_macos_release_handoff.py

      - name: Self-Test Real-Device Smoke Performance Contract
        run: bash Scripts/test_real_device_smoke_performance_gate.sh

      - name: Self-Test Immutable macOS Update Publisher
        run: bash Scripts/test_publish_macos_update_release.sh

      - name: Validate iOS XCTest Configuration
        run: bash Scripts/check_ios_test_configuration.sh --static-only

      - name: Run iOS XCTest Lane
        run: bash "SkyBridge Compass iOS/Scripts/test_lane_ios.sh"

      - name: Require iPhoneOS Apple PQC and Secure Enclave Symbols
        shell: bash
        run: |
          set -euo pipefail
          source Scripts/apple_pqc_sdk_probe.sh
          skybridge_require_apple_pqc_sdk_symbol_probe iphoneos
          [[ "${SKYBRIDGE_PQC_INCLUDED_SECURE_ENCLAVE:-0}" == "1" ]] || {
            echo "::error::iPhoneOS release build requires the Secure Enclave ML-DSA symbol surface."
            exit 1
          }

      - name: Build Generic iOS Release Without Signing
        run: |
          xcodebuild \
            -project "SkyBridge Compass iOS/SkyBridgeCompass-iOS.xcodeproj" \
            -scheme "SkyBridgeCompass-iOS" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${RUNNER_TEMP}/skybridge-ios-generic-release" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            SKYBRIDGE_APPLE_PQC_SDK_CONDITION=HAS_APPLE_PQC_SDK \
            build

      - name: Run Localization Notification Isolation Regression Tests
        run: bash Scripts/run_swift_test_filter.sh SkyBridgeCoreTests.LocalizationManagerNotificationIsolationTests

      - name: Run Swift Package Tests
        run: swift test -Xswiftc -warnings-as-errors

      - name: Run CameraKit Package Tests
        run: swift test --package-path Packages/SkyBridgeCameraKit -Xswiftc -warnings-as-errors

      - name: Build macOS Release Product
        run: swift build -c release --product SkyBridgeCompassApp -Xswiftc -warnings-as-errors

  os27-source-contracts:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SKYBRIDGE_REQUIRED_XCODE_VERSION: "26.6"
      SKYBRIDGE_REQUIRED_XCODE_BUILD: "17F113"
      SKYBRIDGE_REQUIRED_APPLE_SWIFT_VERSION: "6.3.3"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Checkout Pinned Q-Periapt Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: billlza/q-periapt
          ref: 5664fd86a617f92b620ea37e7692d3417d0e307d
          path: External/pqt_hybrid_suite
          persist-credentials: false

      - name: Link Q-Periapt Cargo Path Dependency
        run: |
          [[ -f "External/pqt_hybrid_suite/Cargo.toml" ]] || { echo "::error::Pinned q-periapt checkout is missing Cargo.toml"; exit 1; }
          [[ -f "External/pqt_hybrid_suite/crates/q-periapt-backends/Cargo.toml" ]] || { echo "::error::Pinned q-periapt checkout is missing q-periapt-backends"; exit 1; }
          sibling_path="$PWD/../pqt_hybrid_suite"
          if [[ -e "$sibling_path" && ! -L "$sibling_path" ]]; then
            echo "::error::Refusing to replace non-symlink q-periapt sibling path: $sibling_path"
            exit 1
          fi
          ln -sfn "$PWD/External/pqt_hybrid_suite" "$sibling_path"
          [[ -f "../pqt_hybrid_suite/crates/q-periapt-backends/Cargo.toml" ]] || { echo "::error::q-periapt sibling path dependency is not reachable"; exit 1; }

      - name: Verify Stable Xcode 26.6 Toolchain
        run: |
          [[ -d "$DEVELOPER_DIR" ]] || { echo "::error::Required Xcode 26.6 is missing at $DEVELOPER_DIR"; exit 1; }
          bash Scripts/verify_xcode_toolchain.sh

      - name: Run OS27 Source Contracts
        run: bash Scripts/run_os27_beta_compatibility.sh --verify-source-contracts

  macos-signed-release-gate:
    needs: [macos-preflight, os27-source-contracts]
    runs-on: macos-26
    timeout-minutes: 120
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.macos-preflight.result == 'success' &&
      needs.os27-source-contracts.result == 'success'
    permissions:
      contents: read
      actions: read

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SKYBRIDGE_REQUIRED_XCODE_VERSION: "26.6"
      SKYBRIDGE_REQUIRED_XCODE_BUILD: "17F113"
      SKYBRIDGE_REQUIRED_APPLE_SWIFT_VERSION: "6.3.3"
      RELEASE_ARTIFACT_WORKFLOW_PATH: .github/workflows/real-device-release-gate.yml
      RELEASE_ARTIFACT_EVENT: workflow_dispatch
      CONNECTIVITY_ARTIFACT_NAME: real-device-connectivity-matrix-public-redacted
      P2P_REMOTE_ARTIFACT_NAME: real-device-p2p-remote-smoke-public-redacted
      WEBRTC_REMOTE_ARTIFACT_NAME: real-device-webrtc-smoke-public-redacted
      FILE_TRANSFER_ARTIFACT_NAME: real-device-file-transfer-smoke-public-redacted
      P2P_NOTICE_ARTIFACT_NAME: real-device-p2p-security-notice-public-redacted
      WEBRTC_NOTICE_ARTIFACT_NAME: local-webrtc-security-notice-public-redacted
      NOTICE_PANEL_ARTIFACT_NAME: local-macos-security-notice-panel-public-redacted
      SKYBRIDGE_RELEASE_EVIDENCE_EXPECTED_REPOSITORY: ${{ github.repository }}
      SKYBRIDGE_RELEASE_EVIDENCE_EXPECTED_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Select Xcode 26.6 / Swift 6.3.3 Toolchain
        if: needs.macos-preflight.result == 'success'
        run: |
          [[ -d "$DEVELOPER_DIR" ]] || { echo "::error::Required Xcode 26.6 is missing at $DEVELOPER_DIR"; exit 1; }
          sudo xcode-select -s "$DEVELOPER_DIR"
          bash Scripts/verify_xcode_toolchain.sh

      - name: Validate Release Artifact Run Provenance
        if: needs.macos-preflight.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_RUN_ID: ${{ inputs.release_artifact_run_id }}
          RELEASE_ARTIFACT_RUN_ATTEMPT: ${{ inputs.release_artifact_run_attempt }}
        run: |
          bash Scripts/validate_macos_release_artifact_run.sh \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${RELEASE_ARTIFACT_RUN_ID}" \
            --expected-run-attempt "${RELEASE_ARTIFACT_RUN_ATTEMPT}" \
            --expected-workflow-path "${RELEASE_ARTIFACT_WORKFLOW_PATH}" \
            --expected-event "${RELEASE_ARTIFACT_EVENT}" \
            --expected-head-sha "${GITHUB_SHA}" \
            --expected-head-branch "${GITHUB_REF_NAME}" \
            --artifact "${CONNECTIVITY_ARTIFACT_NAME}" \
            --artifact "${P2P_REMOTE_ARTIFACT_NAME}" \
            --artifact "${WEBRTC_REMOTE_ARTIFACT_NAME}" \
            --artifact "${FILE_TRANSFER_ARTIFACT_NAME}" \
            --artifact "${P2P_NOTICE_ARTIFACT_NAME}" \
            --artifact "${WEBRTC_NOTICE_ARTIFACT_NAME}" \
            --artifact "${NOTICE_PANEL_ARTIFACT_NAME}" \
            --require-public-redacted-artifacts \
            --provenance-output "Artifacts/release-gate/release-artifact-run-provenance.json"

      - name: Download Connectivity Matrix Artifact
        if: needs.macos-preflight.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.CONNECTIVITY_ARTIFACT_NAME }}
          path: Artifacts/release-gate-raw/connectivity
          run-id: ${{ inputs.release_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download P2P Remote Artifact
        if: needs.macos-preflight.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.P2P_REMOTE_ARTIFACT_NAME }}
          path: Artifacts/release-gate-raw/p2p-remote
          run-id: ${{ inputs.release_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download WebRTC Remote Artifact
        if: needs.macos-preflight.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.WEBRTC_REMOTE_ARTIFACT_NAME }}
          path: Artifacts/release-gate-raw/webrtc-remote
          run-id: ${{ inputs.release_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download File Transfer Artifact
        if: needs.macos-preflight.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.FILE_TRANSFER_ARTIFACT_NAME }}
          path: Artifacts/release-gate-raw/file-transfer
          run-id: ${{ inputs.release_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download P2P Security Notice Artifact
        if: needs.macos-preflight.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.P2P_NOTICE_ARTIFACT_NAME }}
          path: Artifacts/release-gate-raw/p2p-notice
          run-id: ${{ inputs.release_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download WebRTC Security Notice Artifact
        if: needs.macos-preflight.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.WEBRTC_NOTICE_ARTIFACT_NAME }}
          path: Artifacts/release-gate-raw/webrtc-notice
          run-id: ${{ inputs.release_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download AppKit Security Notice Panel Artifact
        if: needs.macos-preflight.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.NOTICE_PANEL_ARTIFACT_NAME }}
          path: Artifacts/release-gate-raw/notice-panel
          run-id: ${{ inputs.release_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Extract Mode-Preserving Release Evidence
        if: needs.macos-preflight.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          download_directories=(
            "Artifacts/release-gate-raw/connectivity"
            "Artifacts/release-gate-raw/p2p-remote"
            "Artifacts/release-gate-raw/webrtc-remote"
            "Artifacts/release-gate-raw/file-transfer"
            "Artifacts/release-gate-raw/p2p-notice"
            "Artifacts/release-gate-raw/webrtc-notice"
            "Artifacts/release-gate-raw/notice-panel"
          )
          artifact_names=(
            "$CONNECTIVITY_ARTIFACT_NAME"
            "$P2P_REMOTE_ARTIFACT_NAME"
            "$WEBRTC_REMOTE_ARTIFACT_NAME"
            "$FILE_TRANSFER_ARTIFACT_NAME"
            "$P2P_NOTICE_ARTIFACT_NAME"
            "$WEBRTC_NOTICE_ARTIFACT_NAME"
            "$NOTICE_PANEL_ARTIFACT_NAME"
          )
          for (( index = 0; index < ${#download_directories[@]}; index += 1 )); do
            download_directory="${download_directories[$index]}"
            artifact_name="${artifact_names[$index]}"
            archive_path="$download_directory/$artifact_name.tar.gz"
            extraction_path="$download_directory/public-redacted"
            [[ -f "$archive_path" && ! -L "$archive_path" ]] || {
              echo "::error::Missing mode-preserving evidence archive: $artifact_name"
              exit 1
            }
            unexpected_path="$(find "$download_directory" -mindepth 1 -maxdepth 1 ! -name "$artifact_name.tar.gz" -print -quit)"
            [[ -z "$unexpected_path" ]] || {
              echo "::error::Evidence artifact contains an unexpected top-level entry: $artifact_name"
              exit 1
            }
            python3 Scripts/extract_real_device_release_evidence_archive.py \
              --archive "$archive_path" \
              --destination "$extraction_path"
          done

      - name: Validate Public Release Gate Artifacts
        if: needs.macos-preflight.result == 'success'
        run: |
          bash Scripts/validate_macos_release_public_artifacts.sh \
            --artifact "connectivity|${CONNECTIVITY_ARTIFACT_NAME}|Artifacts/release-gate-raw/connectivity|Artifacts/release-gate-public/connectivity" \
            --artifact "p2p-remote|${P2P_REMOTE_ARTIFACT_NAME}|Artifacts/release-gate-raw/p2p-remote|Artifacts/release-gate-public/p2p-remote" \
            --artifact "webrtc-remote|${WEBRTC_REMOTE_ARTIFACT_NAME}|Artifacts/release-gate-raw/webrtc-remote|Artifacts/release-gate-public/webrtc-remote" \
            --artifact "file-transfer|${FILE_TRANSFER_ARTIFACT_NAME}|Artifacts/release-gate-raw/file-transfer|Artifacts/release-gate-public/file-transfer" \
            --artifact "p2p-notice|${P2P_NOTICE_ARTIFACT_NAME}|Artifacts/release-gate-raw/p2p-notice|Artifacts/release-gate/p2p-notice" \
            --artifact "webrtc-notice|${WEBRTC_NOTICE_ARTIFACT_NAME}|Artifacts/release-gate-raw/webrtc-notice|Artifacts/release-gate/webrtc-notice" \
            --artifact "notice-panel|${NOTICE_PANEL_ARTIFACT_NAME}|Artifacts/release-gate-raw/notice-panel|Artifacts/release-gate/notice-panel"

      - name: Validate Same-SHA Production iOS Identity Evidence
        if: needs.macos-preflight.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          evidence_directories=(
            "Artifacts/release-gate-public/connectivity"
            "Artifacts/release-gate-public/p2p-remote"
            "Artifacts/release-gate-public/webrtc-remote"
            "Artifacts/release-gate-public/file-transfer"
            "Artifacts/release-gate/p2p-notice"
          )
          for evidence_directory in "${evidence_directories[@]}"; do
            python3 Scripts/validate_real_device_release_acceptance_artifact.py \
              --kind production-identity \
              --artifact-dir "$evidence_directory" \
              --expected-source-repository "$GITHUB_REPOSITORY" \
              --expected-source-sha "$GITHUB_SHA"
          done

      - name: Validate Release Signing Secrets
        if: needs.macos-preflight.result == 'success'
        env:
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          MACOS_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
          MACOS_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_WIDGET_PROVISION_PROFILE_BASE64 }}
          NOTARYTOOL_KEY_P8_BASE64: ${{ secrets.NOTARYTOOL_KEY_P8_BASE64 }}
          NOTARYTOOL_KEY_ID: ${{ secrets.NOTARYTOOL_KEY_ID }}
          NOTARYTOOL_ISSUER: ${{ secrets.NOTARYTOOL_ISSUER }}
        run: |
          missing=()
          for key in \
            DEVELOPER_ID_CERT_P12_BASE64 \
            DEVELOPER_ID_CERT_PASSWORD \
            MACOS_PROVISION_PROFILE_BASE64 \
            MACOS_WIDGET_PROVISION_PROFILE_BASE64 \
            NOTARYTOOL_KEY_P8_BASE64 \
            NOTARYTOOL_KEY_ID \
            NOTARYTOOL_ISSUER
          do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required macOS release gate secrets: ${missing[*]}"
            exit 1
          fi

      - name: Import Developer ID Certificate
        if: needs.macos-preflight.result == 'success'
        env:
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-skybridge
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/skybridge-release.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          ORIGINAL_KEYCHAIN_LIST_PATH="$RUNNER_TEMP/original-user-keychains.txt"
          ORIGINAL_DEFAULT_KEYCHAIN_PATH="$RUNNER_TEMP/original-default-keychain.txt"

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
            echo "ORIGINAL_KEYCHAIN_LIST_PATH=$ORIGINAL_KEYCHAIN_LIST_PATH"
            echo "ORIGINAL_DEFAULT_KEYCHAIN_PATH=$ORIGINAL_DEFAULT_KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

          security list-keychains -d user > "$ORIGINAL_KEYCHAIN_LIST_PATH"
          security default-keychain -d user > "$ORIGINAL_DEFAULT_KEYCHAIN_PATH"

          echo "$DEVELOPER_ID_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::Unable to resolve a Developer ID Application identity after importing the certificate."
            exit 1
          fi

          {
            echo "SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Install macOS Provisioning Profile
        if: needs.macos-preflight.result == 'success'
        env:
          MACOS_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$PROFILE_DIR/skybridge-release.provisionprofile"
          mkdir -p "$PROFILE_DIR"
          echo "$MACOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          echo "SKYBRIDGE_MACOS_PROVISIONPROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Install Widget Provisioning Profile
        if: needs.macos-preflight.result == 'success'
        env:
          MACOS_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_WIDGET_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$PROFILE_DIR/skybridge-widget-release.provisionprofile"
          mkdir -p "$PROFILE_DIR"
          echo "$MACOS_WIDGET_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          echo "SKYBRIDGE_WIDGET_PROVISIONPROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Install Notary API Key
        if: needs.macos-preflight.result == 'success'
        env:
          NOTARYTOOL_KEY_P8_BASE64: ${{ secrets.NOTARYTOOL_KEY_P8_BASE64 }}
          NOTARYTOOL_KEY_ID: ${{ secrets.NOTARYTOOL_KEY_ID }}
          NOTARYTOOL_ISSUER: ${{ secrets.NOTARYTOOL_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          NOTARY_KEY_PATH="$RUNNER_TEMP/notarytool-authkey.p8"
          echo "$NOTARYTOOL_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          {
            echo "NOTARYTOOL_KEY=$NOTARY_KEY_PATH"
            echo "NOTARYTOOL_KEY_ID=$NOTARYTOOL_KEY_ID"
            echo "NOTARYTOOL_ISSUER=$NOTARYTOOL_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Build Signed + Notarized Release DMG
        if: needs.macos-preflight.result == 'success'
        env:
          SKYBRIDGE_REQUIRE_APPLE_SIGN_IN_MODE: "web_session"
          SKYBRIDGE_REQUIRE_APP_GROUPS: "1"
          SKYBRIDGE_REQUIRE_WIDGET_EXTENSION: "1"
          SKYBRIDGE_XCODEBUILD_KEEP_NOISE: "1"
        run: |
          bash Scripts/build_dmg.sh \
            --identity "$SIGNING_IDENTITY" \
            --notarize-app \
            --notarize-dmg \
            --require-notarization

      - name: Validate Full macOS Release Readiness
        if: needs.macos-preflight.result == 'success'
        env:
          SKYBRIDGE_RELEASE_GATE_REQUIRE_NOTARIZATION: "1"
        run: |
          bash Scripts/check_macos_release_readiness.sh \
            --require-notarization \
            --connectivity-artifact-dir "Artifacts/release-gate-public/connectivity" \
            --p2p-remote-artifact-dir "Artifacts/release-gate-public/p2p-remote" \
            --webrtc-remote-artifact-dir "Artifacts/release-gate-public/webrtc-remote" \
            --file-transfer-artifact-dir "Artifacts/release-gate-public/file-transfer" \
            --p2p-notice-artifact-dir "Artifacts/release-gate/p2p-notice" \
            --webrtc-notice-artifact-dir "Artifacts/release-gate/webrtc-notice" \
            --notice-panel-artifact-dir "Artifacts/release-gate/notice-panel"

      - name: Assemble Immutable Release Evidence Asset
        if: inputs.publish_update_release == true
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/macos-release-evidence"
          evidence_archive="dist/macos-release-evidence.tar.gz"
          rm -rf "$evidence_root"
          mkdir -p "$evidence_root"

          evidence_sources=(
            "release-artifact-run-provenance|Artifacts/release-gate/release-artifact-run-provenance.json"
            "connectivity|Artifacts/release-gate-public/connectivity"
            "p2p-remote|Artifacts/release-gate-public/p2p-remote"
            "webrtc-remote|Artifacts/release-gate-public/webrtc-remote"
            "file-transfer|Artifacts/release-gate-public/file-transfer"
            "p2p-notice|Artifacts/release-gate/p2p-notice"
            "webrtc-notice|Artifacts/release-gate/webrtc-notice"
            "notice-panel|Artifacts/release-gate/notice-panel"
          )
          for entry in "${evidence_sources[@]}"; do
            label="${entry%%|*}"
            source_path="${entry#*|}"
            [[ -e "$source_path" && ! -L "$source_path" ]] || { echo "::error::Missing or linked release evidence: $source_path"; exit 1; }
            if [[ -d "$source_path" ]]; then
              if find "$source_path" ! -type f ! -type d -print -quit | grep -q .; then
                echo "::error::Release evidence contains a symbolic link or special file: $source_path"
                exit 1
              fi
              mkdir -p "$evidence_root/$label"
              cp -R "$source_path/." "$evidence_root/$label/"
            elif [[ -f "$source_path" && -s "$source_path" ]]; then
              mkdir -p "$evidence_root/$label"
              cp -p "$source_path" "$evidence_root/$label/"
            else
              echo "::error::Release evidence must be a non-empty regular file or directory: $source_path"
              exit 1
            fi
          done

          COPYFILE_DISABLE=1 tar -czf "$evidence_archive" -C "$evidence_root" .
          [[ -s "$evidence_archive" ]] || { echo "::error::Release evidence archive is empty"; exit 1; }
          tar -tzf "$evidence_archive" >/dev/null
          echo "MACOS_RELEASE_EVIDENCE_PATH=$evidence_archive" >> "$GITHUB_ENV"

      - name: Assemble and Verify Signed Release Handoff
        if: inputs.publish_update_release == true
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/SkyBridge Compass Pro.app/Contents/Info.plist')"
          dmg_path="dist/SkyBridgeCompassPro-${app_version}.dmg"
          [[ -f "$dmg_path" ]] || { echo "::error::Notarized DMG not found at $dmg_path"; exit 1; }

          handoff_archive="$RUNNER_TEMP/macos-signed-release-handoff.tar.gz"
          handoff_checksum="$handoff_archive.sha256"
          handoff_verification="$RUNNER_TEMP/macos-signed-release-handoff-verification"
          rm -f "$handoff_archive" "$handoff_checksum"
          rm -rf "$handoff_verification"
          COPYFILE_DISABLE=1 tar -czf "$handoff_archive" \
            -C dist \
            "SkyBridge Compass Pro.app" \
            "$(basename "$dmg_path")" \
            "$(basename "$MACOS_RELEASE_EVIDENCE_PATH")" \
            -C "$GITHUB_WORKSPACE/Artifacts/release-gate" \
            release-artifact-run-provenance.json
          [[ -s "$handoff_archive" ]] || { echo "::error::Signed release handoff is empty"; exit 1; }
          (
            cd "$(dirname "$handoff_archive")"
            shasum -a 256 "$(basename "$handoff_archive")" > "$(basename "$handoff_checksum")"
          )
          python3 Scripts/extract_macos_release_handoff.py \
            --archive "$handoff_archive" \
            --destination "$handoff_verification"
          [[ -f "$handoff_verification/SkyBridge Compass Pro.app/Contents/Info.plist" ]] || {
            echo "::error::Verified handoff is missing the signed app."
            exit 1
          }
          [[ -f "$handoff_verification/$(basename "$dmg_path")" ]] || {
            echo "::error::Verified handoff is missing the notarized DMG."
            exit 1
          }

      - name: Upload Signed Release Handoff
        if: inputs.publish_update_release == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-signed-release-handoff
          path: |
            ${{ runner.temp }}/macos-signed-release-handoff.tar.gz
            ${{ runner.temp }}/macos-signed-release-handoff.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Remove Temporary Signing Credentials
        if: always()
        shell: bash
        run: |
          set -u
          cleanup_failed=0

          if [[ -n "${ORIGINAL_KEYCHAIN_LIST_PATH:-}" && -s "$ORIGINAL_KEYCHAIN_LIST_PATH" ]]; then
            original_keychains=()
            while IFS= read -r keychain; do
              keychain="${keychain#\"}"
              keychain="${keychain%\"}"
              [[ -n "$keychain" ]] && original_keychains+=("$keychain")
            done < "$ORIGINAL_KEYCHAIN_LIST_PATH"
            if (( ${#original_keychains[@]} > 0 )) && ! security list-keychains -d user -s "${original_keychains[@]}"; then
              echo "::error::Unable to restore the original user keychain list."
              cleanup_failed=1
            fi
          fi

          if [[ -n "${ORIGINAL_DEFAULT_KEYCHAIN_PATH:-}" && -s "$ORIGINAL_DEFAULT_KEYCHAIN_PATH" ]]; then
            original_default="$(tr -d '\"\r\n' < "$ORIGINAL_DEFAULT_KEYCHAIN_PATH")"
            if [[ -n "$original_default" ]] && ! security default-keychain -d user -s "$original_default"; then
              echo "::error::Unable to restore the original default keychain."
              cleanup_failed=1
            fi
          fi

          if [[ -n "${KEYCHAIN_PATH:-}" && -e "$KEYCHAIN_PATH" ]] && ! security delete-keychain "$KEYCHAIN_PATH"; then
            echo "::error::Unable to delete the temporary release keychain."
            cleanup_failed=1
          fi

          cleanup_paths=(
            "$RUNNER_TEMP/developer-id.p12"
            "$RUNNER_TEMP/notarytool-authkey.p8"
            "${SKYBRIDGE_MACOS_PROVISIONPROFILE_PATH:-}"
            "${SKYBRIDGE_WIDGET_PROVISIONPROFILE_PATH:-}"
            "$HOME/Library/MobileDevice/Provisioning Profiles/skybridge-release.provisionprofile"
            "$HOME/Library/MobileDevice/Provisioning Profiles/skybridge-widget-release.provisionprofile"
            "${ORIGINAL_KEYCHAIN_LIST_PATH:-}"
            "${ORIGINAL_DEFAULT_KEYCHAIN_PATH:-}"
          )
          for cleanup_path in "${cleanup_paths[@]}"; do
            [[ -z "$cleanup_path" ]] && continue
            if [[ -e "$cleanup_path" || -L "$cleanup_path" ]]; then
              if ! /bin/rm -f "$cleanup_path"; then
                echo "::error::Unable to remove temporary signing material: $cleanup_path"
                cleanup_failed=1
              fi
            fi
          done
          exit "$cleanup_failed"

  macos-immutable-release-publish:
    needs: [macos-preflight, os27-source-contracts, macos-signed-release-gate]
    runs-on: macos-26
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_update_release == true &&
      needs.macos-preflight.result == 'success' &&
      needs.os27-source-contracts.result == 'success' &&
      needs.macos-signed-release-gate.result == 'success'
    environment: macos-production-release
    permissions:
      contents: write
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SKYBRIDGE_REQUIRED_XCODE_VERSION: "26.6"
      SKYBRIDGE_REQUIRED_XCODE_BUILD: "17F113"
      SKYBRIDGE_REQUIRED_APPLE_SWIFT_VERSION: "6.3.3"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Select Xcode 26.6 / Swift 6.3.3 Toolchain
        run: |
          set -euo pipefail
          [[ -d "$DEVELOPER_DIR" ]] || { echo "::error::Required Xcode 26.6 is missing at $DEVELOPER_DIR"; exit 1; }
          sudo xcode-select -s "$DEVELOPER_DIR"
          bash Scripts/verify_xcode_toolchain.sh

      - name: Download Signed Release Handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-signed-release-handoff
          path: ${{ runner.temp }}/macos-signed-release-handoff-download

      - name: Verify and Extract Signed Release Handoff
        shell: bash
        run: |
          set -euo pipefail
          download_root="$RUNNER_TEMP/macos-signed-release-handoff-download"
          handoff_archive="$download_root/macos-signed-release-handoff.tar.gz"
          handoff_checksum="$handoff_archive.sha256"
          handoff_root="$RUNNER_TEMP/macos-signed-release-handoff"

          [[ -f "$handoff_archive" && ! -L "$handoff_archive" ]] || {
            echo "::error::Signed release handoff archive is missing."
            exit 1
          }
          [[ -f "$handoff_checksum" && ! -L "$handoff_checksum" ]] || {
            echo "::error::Signed release handoff checksum is missing."
            exit 1
          }
          unexpected="$(find "$download_root" -mindepth 1 -maxdepth 1 \
            ! -name 'macos-signed-release-handoff.tar.gz' \
            ! -name 'macos-signed-release-handoff.tar.gz.sha256' -print -quit)"
          [[ -z "$unexpected" ]] || {
            echo "::error::Signed release handoff artifact contains an unexpected file."
            exit 1
          }
          (
            cd "$download_root"
            shasum -a 256 -c "$(basename "$handoff_checksum")"
          )
          rm -rf "$handoff_root"
          python3 Scripts/extract_macos_release_handoff.py \
            --archive "$handoff_archive" \
            --destination "$handoff_root"

          dmg_paths=("$handoff_root"/SkyBridgeCompassPro-*.dmg)
          [[ "${#dmg_paths[@]}" == "1" && -f "${dmg_paths[0]}" ]] || {
            echo "::error::Signed release handoff must contain exactly one versioned DMG."
            exit 1
          }
          {
            echo "MACOS_PUBLISH_HANDOFF_ROOT=$handoff_root"
            echo "MACOS_PUBLISH_DMG_PATH=${dmg_paths[0]}"
          } >> "$GITHUB_ENV"

      - name: Validate Explicit Publication Approval and Secrets
        env:
          PUBLISH_RELEASE_TAG: ${{ inputs.publish_release_tag }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.SKYBRIDGE_UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.SKYBRIDGE_UPDATE_MANIFEST_ED25519_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PUBLISH_RELEASE_TAG" =~ ^macos-v[0-9]+\.[0-9]+\.[0-9]+-build-[0-9]+$ ]] || {
            echo "::error::publish_release_tag must use macos-v<semver>-build-<build> form."
            exit 1
          }
          [[ -n "$UPDATE_MANIFEST_KEY_ID" ]] || {
            echo "::error::SKYBRIDGE_UPDATE_MANIFEST_KEY_ID is required for publication."
            exit 1
          }
          [[ -n "$UPDATE_MANIFEST_PRIVATE_KEY_BASE64" ]] || {
            echo "::error::SKYBRIDGE_UPDATE_MANIFEST_ED25519_PRIVATE_KEY_BASE64 is required for publication."
            exit 1
          }

      - name: Publish Immutable GitHub Update Release
        env:
          GH_TOKEN: ${{ github.token }}
          SKYBRIDGE_UPDATE_MANIFEST_ED25519_PRIVATE_KEY_BASE64: ${{ secrets.SKYBRIDGE_UPDATE_MANIFEST_ED25519_PRIVATE_KEY_BASE64 }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.SKYBRIDGE_UPDATE_MANIFEST_KEY_ID }}
          PUBLISH_RELEASE_TAG: ${{ inputs.publish_release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          publish_output="$RUNNER_TEMP/macos-update-publish-output"
          rm -rf "$publish_output"
          mkdir -m 0700 "$publish_output"
          bash Scripts/publish_macos_update_release.sh \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "$PUBLISH_RELEASE_TAG" \
            --expected-source-sha "$GITHUB_SHA" \
            --app-path "$MACOS_PUBLISH_HANDOFF_ROOT/SkyBridge Compass Pro.app" \
            --dmg-path "$MACOS_PUBLISH_DMG_PATH" \
            --manifest-path "$publish_output/macos-stable.json" \
            --proof-summary-path "$publish_output/macos-stable.publish-proof.json" \
            --evidence-provenance-path "$MACOS_PUBLISH_HANDOFF_ROOT/release-artifact-run-provenance.json" \
            --evidence-asset "$MACOS_PUBLISH_HANDOFF_ROOT/macos-release-evidence.tar.gz" \
            --key-id "$UPDATE_MANIFEST_KEY_ID"

      - name: Upload Immutable Release Publish Proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-update-publish-proof-${{ inputs.publish_release_tag }}
          path: ${{ runner.temp }}/macos-update-publish-output/macos-stable.publish-proof.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove Publication Handoff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /bin/rm -rf \
            "$RUNNER_TEMP/macos-signed-release-handoff-download" \
            "$RUNNER_TEMP/macos-signed-release-handoff" \
            "$RUNNER_TEMP/macos-update-publish-output"
