name: Windows Portability

on:
  push:
    branches:
      - main
      - Bill/windows-portability
  pull_request:
    branches:
      - main
      - Bill/windows-portability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portability:
    name: Windows smoke, stack, and Rust CLI coverage
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Fetch mac UI parity baseline
        shell: pwsh
        run: |
          $baselineCommit = '23ba06343bbaa58c30ef6b9bbddd09bb4e80241c'
          git fetch --no-tags --depth=1 origin $baselineCommit
          git cat-file -e "$baselineCommit^{commit}"
          git cat-file -e "$baselineCommit`:Sources/SkyBridgeCompassApp/Dashboard/Navigation/NavigationItem.swift"
          git cat-file -e "$baselineCommit`:Sources/SkyBridgeCompassApp/Dashboard/Sections/DashboardContentView.swift"
          git cat-file -e "$baselineCommit`:Sources/SkyBridgeCompassApp/Dashboard/Sections/QuickActionsPanelView.swift"
          git cat-file -e "$baselineCommit`:Sources/SkyBridgeCompassApp/Dashboard/TopBar/TopNavigationBarView.swift"

      - name: Pin GitHub remote to SSH
        shell: pwsh
        run: |
          git remote set-url origin git@github.com:billlza/Skybridge-Compass.git
          git remote set-url --push origin git@github.com:billlza/Skybridge-Compass.git

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Install Rust coverage tooling
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - name: Run Windows portability gate
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          .\Scripts\verify-windows-portability-smoke.ps1 -CiMode -CheckOnlineStackFreshness -IncludeRustCliCoverage -StackFreshnessEvidencePath artifacts\windows-stack-freshness.json -RustCliCoverageEvidencePath artifacts\rust-cli-coverage.json -AcceptanceEvidencePath artifacts\windows-portability-acceptance.json
          .\Scripts\verify-windows-portability-acceptance-evidence.ps1 -AcceptanceEvidencePath artifacts\windows-portability-acceptance.json -StackFreshnessEvidencePath artifacts\windows-stack-freshness.json -RustCliCoverageEvidencePath artifacts\rust-cli-coverage.json -RequireRustCliCoverage -RequireOnlineStackFreshness
