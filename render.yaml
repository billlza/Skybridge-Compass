services:
  - type: web
    name: skybridge-backend
    runtime: docker
    plan: free
    region: oregon
    branch: official-website
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: RUST_LOG
        value: info
      - key: SKYBRIDGE_WEB_ORIGIN
        value: https://frontend-h3s4sv5nw-li-ziang-s-projects.vercel.app
