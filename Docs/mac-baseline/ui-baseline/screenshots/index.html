<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SkyBridge Compass UI Baseline Captures</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.10);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.62);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(72, 123, 255, 0.18), transparent 30%),
        radial-gradient(circle at top right, rgba(18, 184, 134, 0.16), transparent 28%),
        var(--bg);
      color: var(--text);
    }
    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 32px;
    }
    header {
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.1;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 20px;
    }
    .card {
      padding: 14px;
      border-radius: 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .meta strong {
      color: var(--text);
      font-size: 15px;
    }
    img {
      width: 100%;
      border-radius: 16px;
      display: block;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.16);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>SkyBridge Compass UI Baseline Captures</h1>
      <p>Generated from <code>MacUIBaselineCapture</code> using the runtime manifest on March 9, 2026.</p>
    </header>
    <section class="grid">
      <article class="card">
        <div class="meta"><strong>UI-CAP-001</strong><span>Login</span></div>
        <img src="./mac/UI-CAP-001.png" alt="Login capture" />
      </article>
      <article class="card">
        <div class="meta"><strong>UI-CAP-002</strong><span>Dashboard</span></div>
        <img src="./mac/UI-CAP-002.png" alt="Dashboard capture" />
      </article>
      <article class="card">
        <div class="meta"><strong>UI-CAP-003</strong><span>Devices</span></div>
        <img src="./mac/UI-CAP-003.png" alt="Devices capture" />
      </article>
      <article class="card">
        <div class="meta"><strong>UI-CAP-004</strong><span>USB</span></div>
        <img src="./mac/UI-CAP-004.png" alt="USB capture" />
      </article>
      <article class="card">
        <div class="meta"><strong>UI-CAP-005</strong><span>Transfers</span></div>
        <img src="./mac/UI-CAP-005.png" alt="Transfers capture" />
      </article>
      <article class="card">
        <div class="meta"><strong>UI-CAP-006</strong><span>Remote</span></div>
        <img src="./mac/UI-CAP-006.png" alt="Remote capture" />
      </article>
      <article class="card">
        <div class="meta"><strong>UI-CAP-007</strong><span>Monitor</span></div>
        <img src="./mac/UI-CAP-007.png" alt="Monitor capture" />
      </article>
      <article class="card">
        <div class="meta"><strong>UI-CAP-008</strong><span>Settings</span></div>
        <img src="./mac/UI-CAP-008.png" alt="Settings capture" />
      </article>
      <article class="card">
        <div class="meta"><strong>UI-CAP-009</strong><span>Tray / Notifications</span></div>
        <img src="./mac/UI-CAP-009.png" alt="Tray and notifications capture" />
      </article>
    </section>
  </main>
</body>
</html>
